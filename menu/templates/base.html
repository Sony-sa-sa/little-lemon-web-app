<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Little Lemon{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff;
            color: #333;
        }
        header {
            background: #495e57;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .logo {
            color: #f4ce14;
            font-size: 1.6rem;
            font-weight: bold;
            text-decoration: none;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 600;
        }
        nav a:hover {
            color: #f4ce14;
        }
        main {
            min-height: 60vh;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        footer {
            background: #333;
            color: #ccc;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
        .btn {
            display: inline-block;
            background: #f4ce14;
            color: #333;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="{% url 'home' %}">Little Lemon</a>
        <nav>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'menu' %}">Menu</a>
            <a href="{% url 'book' %}">Book</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {% now "Y" %} Little Lemon Restaurant. Все права защищены.
    </footer>
</body>
</html>
