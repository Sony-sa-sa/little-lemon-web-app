{% extends 'base.html' %}

{% block title %}{{ item.name }} — Little Lemon{% endblock %}

{% block content %}
    <p><a href="{% url 'menu' %}">&larr; Назад к меню</a></p>

    <div style="display:flex; gap:2rem; flex-wrap:wrap;">
        {% if item.image %}
            <img src="{{ item.image.url }}" alt="{{ item.name }}"
                 style="max-width:350px; width:100%; border-radius:10px; object-fit:cover;">
        {% endif %}
        <div>
            <h1>{{ item.name }}</h1>
            <p style="font-size:1.4rem; color:#495e57; font-weight:bold;">${{ item.price }}</p>
            <p>{{ item.description }}</p>
        </div>
    </div>
{% endblock %}
